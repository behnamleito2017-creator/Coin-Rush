<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coin Rush</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    h1 {
      margin: 20px 0 10px;
    }

    #score {
      font-size: 24px;
      margin-bottom: 20px;
    }

    #game {
      position: relative;
      width: 90%;
      max-width: 500px;
      height: 600px;
      margin: auto;
      background: #222;
      border: 2px solid #555;
      overflow: hidden;
      border-radius: 15px;
    }

    .coin {
      position: absolute;
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: gold;
      color: #8a5a00;
      font-size: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
    }

    button {
      margin-top: 20px;
      padding: 12px 25px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1>🪙 Coin Rush</h1>
  <div id="score">Coins: 0</div>

  <div id="game"></div>

  <button onclick="startGame()">Start Game</button>

  <script>
    let score = 0;
    let coin;

    function createCoin() {
      const game = document.getElementById("game");

      if (coin) {
        coin.remove();
      }

      coin = document.createElement("div");
      coin.className = "coin";
      coin.textContent = "🪙";

      const x = Math.random() * (game.clientWidth - 55);
      const y = Math.random() * (game.clientHeight - 55);

      coin.style.left = x + "px";
      coin.style.top = y + "px";

      coin.onclick = function () {
        score++;
        document.getElementById("score").textContent =
          "Coins: " + score;

        createCoin();
      };

      game.appendChild(coin);
    }

    function startGame() {
      score = 0;
      document.getElementById("score").textContent = "Coins: 0";
      createCoin();
    }
  </script>

</body>
</html>
